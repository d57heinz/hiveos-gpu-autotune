<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig monitor</title>
<style>
:root{
  color-scheme:dark;
  --page:#0f1720; --panel:#18212c; --line:#2a3847; --text:#e8eef4; --muted:#93a4b5;
  --series:#3987e5; --series2:#d95926; --good:#0ca30c; --warn:#fab219; --crit:#e05252;
  --sans:Bahnschrift,"DIN Alternate","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums}
main{max-width:1500px;margin:0 auto;padding:20px 20px 60px}
h1{font-size:30px;font-weight:600;margin:0;letter-spacing:.01em}
h3{font-size:16px;font-weight:600;margin:0}
h4{font-size:15px;font-weight:600;margin:14px 0 2px}
.sub{color:var(--muted);font-weight:400}
.top{display:flex;flex-wrap:wrap;gap:8px 40px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.totals{display:flex;gap:36px;flex-wrap:wrap}
.fig b{display:block;font-size:34px;font-weight:600;line-height:1.1}
.fig span{color:var(--muted)}
.bar2{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin:14px 0 16px;color:var(--muted);font-size:14px}
.notice{margin-top:12px;padding:10px 14px;border-left:3px solid var(--warn);background:var(--panel)}
#grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px 14px;min-width:0}
.w3{grid-column:span 3}.w4{grid-column:span 4}.w6{grid-column:span 6}.w12,.wide{grid-column:1/-1}
.panel>header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.grab{flex:1;min-width:0;cursor:grab;user-select:none}
.grab:active{cursor:grabbing}
.tools{display:flex;gap:4px;opacity:.55}
.panel:hover .tools,.tools:focus-within{opacity:1}
.tools button{padding:1px 7px;line-height:1.4}
.panel.dragging{opacity:.4}
.panel.over{outline:2px dashed var(--series);outline-offset:2px}
svg{display:block;width:100%;overflow:visible}
svg text{fill:var(--muted);font:12px var(--sans)}
.grid line{stroke:var(--line)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 18px;margin:10px 0 0}
dt{color:var(--muted);font-size:13px}
dd{margin:0;font-size:17px}
.chip{font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.live{border-color:var(--series);color:var(--text)}
.chip.bad{border-color:var(--crit);color:var(--text)}
.chip.ok{border-color:var(--good);color:var(--text)}
.meter{height:5px;background:var(--line);border-radius:3px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--series);border-radius:3px}
.status{font-size:17px;margin:2px 0 10px}
.status.bad{color:var(--warn)}
table{border-collapse:collapse;width:100%;margin-top:6px}
th,td{text-align:right;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:400;font-size:13px}
th:first-child,td:first-child{text-align:left}
tr.pick td{background:#1f2c3a}
.scroll{overflow-x:auto}
select,button{font:inherit;color:var(--text);background:var(--page);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
button{cursor:pointer}
button:hover{border-color:var(--muted)}
button[aria-pressed=true]{border-color:var(--series)}
button:disabled{opacity:.5;cursor:default}
select:focus-visible,button:focus-visible,input:focus-visible,pre:focus-visible{outline:2px solid var(--series);outline-offset:2px}
.switch{display:inline-flex;align-items:center;gap:8px;padding:3px 10px 3px 4px;border-radius:99px}
.switch i{width:30px;height:16px;border-radius:99px;background:var(--line);position:relative;display:inline-block}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.switch[aria-checked=true] i{background:var(--series)}
.switch[aria-checked=true] i::after{left:16px;background:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:6px 0 4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px;margin:8px 0}
.form label{display:block;color:var(--muted);font-size:13px;white-space:normal}
.form input[type=number]{display:block;width:100%;margin-top:3px;font:inherit;color:var(--text);background:var(--page);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.cards label{display:inline-block;margin:0 16px 4px 0;font-size:15px;color:var(--text)}
button.go{border-color:var(--series)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.legend svg{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}
pre.log{margin:0;height:430px;overflow:auto;font:12px/1.4 var(--mono);white-space:pre;color:#cfd9e3;background:var(--page);border:1px solid var(--line);border-radius:4px;padding:8px}
.panel label{color:var(--muted);font-size:13px;white-space:nowrap}
#tip{position:fixed;pointer-events:none;background:#0b1118;border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:13px;white-space:pre;display:none;z-index:5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(720px,92vw);background:#0b1118;border:1px solid var(--series);border-radius:6px;padding:10px 16px;display:none;z-index:6}
#toast.bad{border-color:var(--warn)}
.empty{color:var(--muted);padding:6px 0}
.trend{display:grid;grid-template-columns:88px 1fr 112px;gap:8px;align-items:center;margin-top:4px}
.trend span{color:var(--muted);font-size:13px}
.trend b{font-weight:400;text-align:right;white-space:nowrap}
.trend:first-of-type b{font-size:21px;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px 0;margin:2px 0 10px;padding:0;list-style:none}
.steps li{padding:3px 12px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.steps li+li{border-left:0}
.steps li:first-child{border-radius:4px 0 0 4px}.steps li:last-child{border-radius:0 4px 4px 0}
.steps li.done{color:var(--text)}
.steps li.now{color:var(--text);border-color:var(--series);box-shadow:inset 0 -2px 0 var(--series)}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--series)}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--page)}
.recent{margin:8px 0 12px;padding:0;list-style:none;color:var(--muted);font-size:14px}
.recent b{color:var(--text);font-weight:400}
@media (max-width:1100px){.w3{grid-column:span 6}.w4,.w6{grid-column:1/-1}.two{grid-template-columns:1fr}}
@media (max-width:700px){.w3{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1 id="host">Rig monitor</h1><div class="sub" id="meta">Connecting…</div></div>
    <div class="totals">
      <div class="fig"><b id="t-hr">–</b><span>hashrate</span></div>
      <div class="fig"><b id="t-pw">–</b><span>GPU power</span></div>
      <div class="fig"><b id="t-eff">–</b><span>efficiency</span></div>
    </div>
  </div>
  <div id="notice"></div>
  <div class="bar2">
    <span>Drag a panel by its title to move it. The buttons on each panel move it or switch it between normal and full width.</span>
    <span>Charts show the last <button data-range="900">15 min</button> <button data-range="3600" aria-pressed="true">1 hour</button> <button data-range="21600">6 hours</button>
      &nbsp; <button id="logs-wide" aria-pressed="false">Logs full width</button> <button id="reset">Reset layout</button></span>
  </div>
  <div id="grid"></div>
</main>
<div id="tip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let hist=[], last=0, range=3600, state=null, pick={}, dragging=null, busy=false;

// ---------- formatting
function unit(v,units){ if(v==null||isNaN(v))return "–"; for(const [u,d] of units) if(Math.abs(v)>=d) return (v/d).toFixed(v/d>=100?1:2)+" "+u; return v.toFixed(0)+" "+units.at(-1)[0].slice(1); }
const fHr=v=>unit(v,[["PH/s",1e15],["TH/s",1e12],["GH/s",1e9],["MH/s",1e6],["kH/s",1e3]]);
const fEff=v=>unit(v,[["TH/W",1e12],["GH/W",1e9],["MH/W",1e6],["kH/W",1e3]]);
const fW=v=>v==null?"–":(v>=1000?(v/1000).toFixed(2)+" kW":v.toFixed(0)+" W");
const fOff=v=>v==null?"–":(v>=0?"+":"")+v;
const slot=b=>String(b||"").replace(/^0+:/,"");
function dur(s){ if(s==null)return "–"; s=Math.floor(s); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?`${d} d ${h} h`:h?`${h} h ${m} min`:`${m} min`; }
const clock=t=>new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e; }
function tip(ev,text){ const t=$("tip"); if(!text){t.style.display="none";return;} t.textContent=text; t.style.display="block";
  t.style.left=Math.min(ev.clientX+14, innerWidth-t.offsetWidth-8)+"px"; t.style.top=(ev.clientY+14)+"px"; }
let toastTimer; function toast(msg,bad){ const t=$("toast"); t.textContent=msg; t.className=bad?"bad":""; t.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display="none",9000); }
function niceMax(v){ if(!(v>0))return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.5,2,3,4,5,7.5,10]) if(m*p>=v) return m*p; return 10*p; }

// ---------- layout: panels in one grid; order and width are remembered in this browser
const RANK=id=>id.startsWith("chart")?0:id.startsWith("gpu:")?1:id=="bests"?2:id=="queue"?3:id.startsWith("tuner:")?4:id=="start"?5:6;
const SPAN=id=>id.startsWith("chart")?6:id.startsWith("gpu:")?3:id.startsWith("log-")?4:12;
let layout={order:[],wide:{}}; try{ layout=Object.assign(layout,JSON.parse(localStorage.getItem("rigmon-layout")||"{}")); }catch(e){}
function saveLayout(){ layout.order=[...$("grid").children].map(w=>w.dataset.id); try{ localStorage.setItem("rigmon-layout",JSON.stringify(layout)); }catch(e){} }
function redraw(){ if(state){ renderCharts(); renderTuning(state,true); } }
function setWide(w,on){ w.classList.toggle("wide",on); const b=w.querySelector("[data-act=wide]"); b.setAttribute("aria-pressed",on); b.title=on?"Back to normal width":"Make full width"; }
function widget(id,title){
  let w=document.querySelector(`#grid>[data-id="${CSS.escape(id)}"]`);
  if(w) return w;
  w=document.createElement("section"); w.className="panel w"+SPAN(id); w.dataset.id=id;
  w.innerHTML=`<header><h3 class="grab" title="Drag to move"></h3><span class="extra"></span><span class="tools"><button data-act="up" title="Move earlier" aria-label="Move earlier">◀</button><button data-act="down" title="Move later" aria-label="Move later">▶</button><button data-act="wide" aria-label="Full width">⤢</button></span></header><div class="body"></div>`;
  w.querySelector("h3").textContent=title||"";
  setWide(w,!!layout.wide[id]);
  w.querySelector(".tools").onclick=ev=>{ const a=ev.target.dataset.act; if(!a) return;
    if(a=="wide"){ const on=!w.classList.contains("wide"); layout.wide[id]=on; setWide(w,on); }
    if(a=="up"&&w.previousElementSibling) w.parentNode.insertBefore(w,w.previousElementSibling);
    if(a=="down"&&w.nextElementSibling) w.parentNode.insertBefore(w.nextElementSibling,w);
    saveLayout(); syncLogsBtn(); redraw(); };
  const grab=w.querySelector(".grab");
  grab.onmousedown=()=>w.draggable=true; grab.onmouseup=()=>w.draggable=false;
  w.ondragstart=ev=>{ dragging=w; w.classList.add("dragging"); ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain",id); };
  w.ondragend=()=>{ w.draggable=false; w.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); dragging=null; saveLayout(); redraw(); };
  w.ondragover=ev=>{ if(!dragging||dragging===w) return; ev.preventDefault(); w.classList.add("over"); };
  w.ondragleave=()=>w.classList.remove("over");
  w.ondrop=ev=>{ ev.preventDefault(); w.classList.remove("over"); if(!dragging||dragging===w) return;
    const r=w.getBoundingClientRect(), after=(ev.clientX-r.left)/r.width>.5; w.parentNode.insertBefore(dragging, after?w.nextSibling:w); };
  // place it: saved position if known, otherwise by its default group
  const key=x=>{ const i=layout.order.indexOf(x); return i>=0?[0,i]:[1,RANK(x)]; }, k=key(id);
  const before=[...$("grid").children].find(c=>{ const o=key(c.dataset.id); return o[0]>k[0]||(o[0]==k[0]&&o[1]>k[1]); });
  $("grid").insertBefore(w,before||null);
  return w;
}
function dropWidget(id){ const w=document.querySelector(`#grid>[data-id="${CSS.escape(id)}"]`); if(w) w.remove(); }
const body=w=>w.querySelector(".body"), extra=w=>w.querySelector(".extra");
function syncLogsBtn(){ const ws=[...document.querySelectorAll('#grid>[data-id^="log-"]')]; $("logs-wide").setAttribute("aria-pressed",ws.length>0&&ws.every(w=>w.classList.contains("wide"))); }
$("logs-wide").onclick=()=>{ const ws=[...document.querySelectorAll('#grid>[data-id^="log-"]')], on=!ws.every(w=>w.classList.contains("wide")); ws.forEach(w=>{ layout.wide[w.dataset.id]=on; setWide(w,on); }); saveLayout(); syncLogsBtn(); };
$("reset").onclick=()=>{ try{ localStorage.removeItem("rigmon-layout"); }catch(e){} location.reload(); };

// ---------- charts
function lineChart(svg, pts, fmt){
  svg.textContent=""; const W=svg.clientWidth||600,H=+svg.getAttribute("height"),L=8,R=8,T=10,B=22;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  if(pts.length<2){ el("text",{x:L,y:H/2},svg).textContent="Collecting data…"; return; }
  const t0=pts[0][0],t1=pts.at(-1)[0], ymax=niceMax(Math.max(...pts.map(p=>p[1])));
  const X=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), Y=v=>T+(1-v/ymax)*(H-T-B);
  const g=el("g",{class:"grid"},svg);
  for(const f of [0,.5,1]){ el("line",{x1:L,x2:W-R,y1:Y(ymax*f),y2:Y(ymax*f)},g); el("text",{x:L+2,y:Y(ymax*f)-4},svg).textContent=f?fmt(ymax*f):""; }
  for(const f of [0,.5,1]) el("text",{x:L+f*(W-L-R),y:H-5,"text-anchor":f==0?"start":f==1?"end":"middle"},svg).textContent=clock(t0+f*(t1-t0));
  let d=""; pts.forEach((p,i)=>{ const gap=i&&p[0]-pts[i-1][0]>60; d+=(i&&!gap?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1); });
  el("path",{d,fill:"none",stroke:"var(--series)","stroke-width":2,"stroke-linejoin":"round"},svg);
  const cross=el("line",{y1:T,y2:H-B,stroke:"var(--muted)","stroke-dasharray":"3 3",visibility:"hidden"},svg);
  const dot=el("circle",{r:4,fill:"var(--series)",stroke:"var(--panel)","stroke-width":2,visibility:"hidden"},svg);
  const hit=el("rect",{x:L,y:T,width:W-L-R,height:H-T-B,fill:"transparent"},svg);
  hit.onmousemove=ev=>{ const r=svg.getBoundingClientRect(), t=t0+(ev.clientX-r.left-L)/(W-L-R)*(t1-t0);
    let b=pts[0]; for(const p of pts) if(Math.abs(p[0]-t)<Math.abs(b[0]-t)) b=p;
    cross.setAttribute("x1",X(b[0])); cross.setAttribute("x2",X(b[0])); cross.setAttribute("visibility","visible");
    dot.setAttribute("cx",X(b[0])); dot.setAttribute("cy",Y(b[1])); dot.setAttribute("visibility","visible");
    tip(ev, new Date(b[0]*1000).toLocaleTimeString()+"\n"+fmt(b[1])); };
  hit.onmouseleave=()=>{ cross.setAttribute("visibility","hidden"); dot.setAttribute("visibility","hidden"); tip(); };
}
function spark(pts,label,lo,hi){ const W=260,H=26; if(pts.length<2) return `<svg viewBox="0 0 ${W} ${H}" height="${H}"></svg>`;
  const t0=pts[0][0],t1=pts.at(-1)[0]; lo=lo??0; hi=hi??niceMax(Math.max(...pts.map(p=>p[1])));
  const d=pts.map((p,i)=>(i?"L":"M")+((p[0]-t0)/(t1-t0||1)*W).toFixed(1)+" "+(2+(1-Math.min(1,Math.max(0,(p[1]-lo)/(hi-lo||1))))*(H-4)).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="none" role="img" aria-label="${label} over the last hour"><path d="${d}" fill="none" stroke="var(--series)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`; }
function trend(label,pts,now,lo,hi){ return `<div class="trend"><span>${label}</span>${spark(pts,label,lo,hi)}<b>${now}</b></div>`; }
function testChart(svg, rows, xkey, xfmt, best, color){
  svg.textContent=""; const W=svg.clientWidth||500,H=+svg.getAttribute("height"),L=8,R=14,T=12,B=24;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  if(!rows.length){ el("text",{x:L,y:H/2},svg).textContent="No tests yet at this power limit."; return; }
  const xs=rows.map(r=>r[xkey]), x0=Math.min(...xs), x1=Math.max(...xs);
  const ok=rows.filter(r=>r.stable), effs=ok.map(r=>r.eff);
  let lo=effs.length?Math.min(...effs):0, hi=effs.length?Math.max(...effs):1; const pad=(hi-lo)*.15||hi*.02||1; lo-=pad; hi+=pad;
  const X=v=>L+10+(x1==x0?.5:(v-x0)/(x1-x0))*(W-L-R-20), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B-16);
  const g=el("g",{class:"grid"},svg);
  for(const f of [0,.5,1]){ const y=Y(lo+f*(hi-lo)); el("line",{x1:L,x2:W-R,y1:y,y2:y},g); el("text",{x:L+2,y:y-4},svg).textContent=fEff(lo+f*(hi-lo)); }
  el("line",{x1:L,x2:W-R,y1:H-B,y2:H-B},g);
  (x1==x0?[x0]:[x0,(x0+x1)/2,x1]).forEach(v=>{ el("text",{x:X(v),y:H-6,"text-anchor":"middle"},svg).textContent=xfmt(Math.round(v)); });
  const sorted=[...ok].sort((a,b)=>a[xkey]-b[xkey]);
  if(sorted.length>1) el("path",{d:sorted.map((r,i)=>(i?"L":"M")+X(r[xkey])+" "+Y(r.eff)).join(""),fill:"none",stroke:color,"stroke-width":1.5,opacity:.45},svg);
  for(const r of rows){
    const x=X(r[xkey]); let info;
    if(r.stable){ const y=Y(r.eff), isBest=best&&best.offset===r.offset&&best.cap===r.cap;
      if(isBest) el("circle",{cx:x,cy:y,r:9,fill:"none",stroke:"var(--text)","stroke-width":2},svg);
      el("circle",{cx:x,cy:y,r:4.5,fill:color,stroke:"var(--panel)","stroke-width":2},svg);
      info=`${xfmt(r[xkey])}${isBest?"  (best)":""}\n${fEff(r.eff)}\n${fHr(r.hashrate)} at ${r.power} W${r.volt?"\n"+r.volt+" mV":""}`; }
    else { const y=H-B-8; el("path",{d:`M${x-5} ${y-5}L${x+5} ${y+5}M${x+5} ${y-5}L${x-5} ${y+5}`,stroke:"var(--crit)","stroke-width":2.5},svg);
      info=`${xfmt(r[xkey])}\nFailed: ${r.reason||"crash"}`; }
    const h=el("circle",{cx:x,cy:r.stable?Y(r.eff):H-B-8,r:13,fill:"transparent"},svg);
    h.onmousemove=ev=>tip(ev,info); h.onmouseleave=()=>tip();
  }
}

// ---------- panels
function renderTop(s){
  $("host").textContent=s.sys.host||"Rig monitor"; document.title=(s.sys.host||"Rig")+" monitor";
  const hr=s.miner?s.gpus.reduce((a,g)=>a+(g.hr||0),0):null, pw=s.gpus.reduce((a,g)=>a+(g.power||0),0);
  $("t-hr").textContent=fHr(hr); $("t-pw").textContent=fW(pw); $("t-eff").textContent=hr&&pw?fEff(hr/pw):"–";
  $("meta").textContent=`Up ${dur(s.sys.uptime)}, load ${(s.sys.load||[]).join(" ")}`+(s.miner&&s.miner.uptime!=null?`, miner running ${dur(s.miner.uptime)}`:"")+`, updated ${new Date(s.t*1000).toLocaleTimeString()}`;
  const n=[]; if(!s.gpus.length) n.push("nvidia-smi returned no cards. The driver may not be loaded.");
  if(!s.miner) n.push("The miner's API is not answering, so hashrate and shares are not shown. The miner may be stopped or paused for a power-limit change.");
  $("notice").innerHTML=n.map(x=>`<div class="notice">${esc(x)}</div>`).join("");

    if(!r.ok) throw new Error(r.status==403?"The rig refused this (controls are off in read-only mode).":"The rig answered with error "+r.status+".");

  busy=false; poll();
}

// ---------- polling
async function poll(){
  try{ const s=await (await fetch("/api/state?since="+last)).json(); state=s;
    hist=hist.concat(s.history); if(hist.length) last=hist.at(-1).t; const cut=Date.now()/1000-21700; hist=hist.filter(p=>p.t>=cut);
    renderTop(s); if(dragging) return; renderCharts(); renderGpus(s); renderTuning(s);
  }catch(e){ $("meta").textContent="Cannot reach the rig monitor. It will keep trying."; }
}
async function logs(){
  for(const id of ["log-tuner","log-miner","log-syslog"]){
    const w=document.querySelector(`#grid>[data-id="${id}"]`); if(!w) continue;
    const pre=w.querySelector("pre"), sel=w.querySelector("select"), src=id=="log-tuner"?(sel&&sel.value?"tuner:"+sel.value:""):id.slice(4);
    if(!src){ pre.textContent="No tuning run yet."; continue; }
    try{ const text=await (await fetch("/api/log?n=400&src="+encodeURIComponent(src))).text();
      pre.textContent=text; if(w.querySelector("input").checked) pre.scrollTop=pre.scrollHeight; }catch(e){}
  }
}
document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{ range=+b.dataset.range; document.querySelectorAll("[data-range]").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderCharts(); });
addEventListener("resize",redraw);
poll().then(logs); setInterval(poll,5000); setInterval(logs,5000);
</script>
</body>
</html>
